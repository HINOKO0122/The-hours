name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Project
        run: |
          echo '{"name": "the-hours", "version": "1.0.0"}' > package.json
          mkdir www
          cp -r * www/ || true
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Setup Capacitor
        run: |
          npx cap init "The Hours" "com.hinoko.thehours" --web-dir "www"
          npx cap add android
          npx cap copy android

      - name: Force Resolve Dependencies
        run: |
          # 1. Jetifierをあえてオフにする（重複の主な原因になるため）
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=false" >> android/gradle.properties
          
          # 2. build.gradleを書き換えて、重複ファイルを「最初に見つけたものを使う」設定にする
          # これが重複エラーを黙らせる最強の呪文です
          sed -i '/android {/a \    packagingOptions {\n        pickFirst "**/kotlin-stdlib-jdk8.jar"\n        pickFirst "**/kotlin-stdlib-jdk7.jar"\n        pickFirst "**/kotlin-stdlib.jar"\n    }' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
