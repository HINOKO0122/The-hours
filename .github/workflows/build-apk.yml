name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build APK with Bubblewrap
        run: |
          # Google公式の変換ツールをインストール
          npm install -g @bubblewrap/cli
          
          # 初期設定ファイルを自動生成（対話なしで進める設定）
          bubblewrap init --manifest="https://hinoko0122.github.io/The-hours/manifest.json" --meta --no-interaction
          
          # APKをビルド（署名はスキップ）
          bubblewrap build --skipSigning
          
          # 出力先の確認用
          ls -R

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./*.apk
