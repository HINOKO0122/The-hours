name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PWAをAPKに変換する軽量なAction
      - name: PWA to APK
        uses: koddr/pwa-to-apk-action@v2
        with:
          # あなたのゲームのURL
          url: "https://hinoko0122.github.io/The-hours/"
          # アプリの名前
          name: "The Hours"
          # 署名なしでデバッグ用APKを作成
          debug: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          # このアクションはデフォルトで 'output.apk' のような名前で出します
          path: "*.apk"
