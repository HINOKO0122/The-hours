name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Project
        run: |
          # 1. package.json の作成
          echo '{"name": "the-hours", "version": "1.0.0"}' > package.json
          
          # 2. アプリ用フォルダ 'www' を作り、ゲームファイルをコピー
          # (.gitなどは除外して、純粋なゲームファイルだけをまとめます)
          mkdir www
          cp -r * www/ || true
          
          # 3. 必要なツールをインストール
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Setup Capacitor
        run: |
          # 4. 初期化 (web-dir をさっき作った 'www' に指定)
          npx cap init "The Hours" "com.hinoko.thehours" --web-dir "www"
          
          # 5. Androidプロジェクトの追加と同期
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
