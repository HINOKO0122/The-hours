name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Project
        run: |
          # 1. 不足している package.json をその場で作る
          if [ ! -f package.json ]; then
            echo '{"name": "the-hours", "version": "1.0.0"}' > package.json
          fi
          
          # 2. 必要なツールをインストール
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Setup Capacitor
        run: |
          # 3. 初期化（--web-dir "." は index.html が直下にある前提）
          npx cap init "The Hours" "com.hinoko.thehours" --web-dir "."
          
          # 4. Androidプロジェクトの追加
          npx cap add android
          
          # 5. ウェブのファイルをAndroid側にコピー
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # デバッグ用APKを作成
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
