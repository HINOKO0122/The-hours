name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 最小限のAndroidプロジェクトをその場で作成
      - name: Setup Android Project
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          # プロジェクトを初期化
          npx cap init "The Hours" "com.hinoko.thehours" --web-dir "."
          # Androidのガワ（フォルダ）を追加
          npx cap add android

      # 2. ビルド
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 3. APKを回収
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
