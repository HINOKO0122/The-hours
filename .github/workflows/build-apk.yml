name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Project
        run: |
          echo '{"name": "the-hours", "version": "1.0.0"}' > package.json
          mkdir www
          cp -r * www/ || true
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Setup Capacitor
        run: |
          npx cap init "The Hours" "com.hinoko.thehours" --web-dir "www"
          npx cap add android
          npx cap copy android

      - name: Force Resolve Dependencies
        run: |
          # 1. Capacitorの標準設定（JetifierはONに戻しておきます）
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # 2. Kotlinクラスの重複エラーを根本から防ぐ最強の呪文
          # （すべてのプロジェクトとプラグインから古いjdk7/jdk8を除外する）
          cat <<EOF >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apkname: Build Android APK
