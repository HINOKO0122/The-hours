name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android App
        # 新しい公式アクション名に変更しました
        uses: pwabuilder/pwa-action@v1
        with:
          # ここにあなたのゲームのURLを入れてください（例: https://hinoko0122.github.io/The-hours/）
          url: 'https://hinoko0122.github.io/The-hours/'
          name: 'The hours'
          # android だけで動くように指定
          android-enabled: true
          # 署名などの面倒な設定をスキップしてテスト用APKを作る設定
          signing-key-path: ''
