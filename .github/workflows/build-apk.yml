name: Build Android APK
on:
  push:
    branches: [ main, master ] # あなたのブランチ名がmainならこのままでOK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android App
        uses: pwa-builder/pwa-auth-action@v1
        with:
          # あなたのゲームが公開されているURL (GitHub Pagesなど)
          url: 'https://hinoko0122.github.io/The-hours/'
          # 出力されるアプリ名
          name: 'The hours'
          # Android用の設定
          platform: 'android'
