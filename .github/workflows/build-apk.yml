name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build APK with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          # 質問にすべて「yes」と答えるように設定して初期化
          yes | bubblewrap init --manifest="https://hinoko0122.github.io/The-hours/manifest.json" --meta --no-interaction
          
          # 署名なしでビルドを強行
          bubblewrap build --skipSigning
          
          # apkファイルの名前を「app-debug.apk」に統一（後のステップで見つけやすくするため）
          mv *.apk game-debug.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: game-debug.apk
