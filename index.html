<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The hours</title>
    <style>
        :root { --main: #2c3e50; --accent: #2980b9; --bg: #f4f7f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--main); }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status { display: grid; grid-template-columns: 1fr 1fr; background: #eee; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.85rem; gap: 5px; }
        .status-full { grid-column: 1/3; border-top: 1px solid #ccc; padding-top: 5px; text-align: center; }
        .main-btn { width: 100%; padding: 18px; background: var(--accent); color: #fff; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .main-btn:disabled { background: #ccc; }
        .tabs { display: flex; gap: 5px; margin: 10px 0; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 8px; font-size: 0.8rem; }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; text-align: center; font-size: 0.85rem; background: #fff; }
        .card.active-set { border: 2px solid #27ae60; background: #f0fff4; }
        .hidden { display: none; }
        #timer { text-align: center; font-weight: bold; font-size: 0.9rem; color: #e74c3c; margin-bottom: 10px; }
        .action-btn { width: 100%; margin-top: 5px; padding: 5px; border-radius: 5px; border: 1px solid #ccc; background: #fff; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>The hours</h1>
    <div class="status">
        <div>金貨: <span id="money">0</span></div>
        <div>毎秒: <span id="income">0</span></div>
        <div class="status-full">セット中: <span id="active-name">なし</span></div>
        <div class="status-full">累計ログイン: <span id="log-days">0</span>日</div>
    </div>

    <div id="timer">確認中...</div>
    <button id="get-btn" class="main-btn" onclick="getCharacter()">GETする</button>

    <div class="tabs">
        <button id="tab-storage" class="tab-btn active" onclick="switchTab('storage')">倉庫</button>
        <button id="tab-shop" class="tab-btn" onclick="switchTab('shop')">ショップ</button>
        <button id="tab-zukan" class="tab-btn" onclick="switchTab('zukan')">図鑑</button>
    </div>

    <div id="storage-sec">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div style="font-weight: bold;">倉庫: <span id="storage-usage">0/0</span></div>
            <select id="sort-select" onchange="renderStorage()" style="font-size: 0.8rem;">
                <option value="new">新しい順</option>
                <option value="type">キャラ順</option>
                <option value="income">収益順</option>
            </select>
        </div>
        <div id="storage-grid" class="grid"></div>
    </div>

    <div id="shop-sec" class="hidden">
        <div id="shop-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div id="zukan-sec" class="hidden">
        <div id="zukan-list" class="grid"></div>
    </div>
</div>

<script>
let config = null;
let gameData = {
    money: 0, characters: [], activeCharId: null, lastGetTime: 0, lastUpdate: Date.now(),
    zukan: {}, storageLevel: 0, sprayCount: 0, clockCount: 0, logDays: 0, lastLogDate: ""
};

async function init() {
    try {
        const res = await fetch('config.json');
        config = await res.json();
    } catch(e) { alert("config.jsonが見つかりません"); return; }
    
    const saved = localStorage.getItem('TheHours_Final_NoImg');
    if (saved) {
        gameData = JSON.parse(saved);
        calcOffline();
    }
    checkLogin();
    renderAll();
    setInterval(gameLoop, 1000);
}

function checkLogin() {
    const today = new Date().toLocaleDateString();
    if (gameData.lastLogDate !== today) {
        gameData.logDays++;
        gameData.lastLogDate = today;
        save();
    }
}

function calcOffline() {
    if (!gameData.activeCharId) return;
    const now = Date.now();
    const diff = Math.floor((now - gameData.lastUpdate) / 1000);
    if (diff > 0) {
        const char = gameData.characters.find(c => c.id === gameData.activeCharId);
        if (char) gameData.money += getFullIncome(char) * diff;
    }
}

function lotteryType() {
    const total = config.characters.reduce((s, c) => s + c.weight, 0);
    let r = Math.random() * total;
    for (const c of config.characters) { if (r < c.weight) return c; r -= c.weight; }
    return config.characters[0];
}

function lotteryColor() {
    let r = Math.random(), cum = 0;
    for (const c of config.colors) { cum += c.prob; if (r < cum) return c; }
    return config.colors[0];
}

function getBaseIncome(char) {
    const cData = config.colors.find(c => c.name === char.color);
    return char.baseValue * (char.iv / 100) * cData.bonus;
}

function getFullIncome(char) {
    const base = getBaseIncome(char);
    const colorComp = Object.values(gameData.zukan).filter(z => Object.keys(z.colors).length >= 9).length;
    const ivComp = Object.values(gameData.zukan).filter(z => z.maxIV === 100).length;
    return base * (1 + colorComp * 0.1) * (1 + ivComp * 0.1) + gameData.logDays;
}

function getCharacter() {
    const today = new Date().toLocaleDateString();
    const isFirstToday = localStorage.getItem('lastGetDate') !== today;
    const getCount = isFirstToday ? 2 : 1;
    const maxSpace = 3 + gameData.storageLevel;

    if (gameData.characters.length + getCount > maxSpace) {
        return alert("倉庫に空きが足りません！");
    }

    const wait = 3600000 * Math.pow(0.99, gameData.clockCount);
    if (Date.now() - gameData.lastGetTime < wait) return;

    for(let i=0; i<getCount; i++) {
        const t = lotteryType();
        const c = lotteryColor();
        const newChar = { id: Date.now()+i, type: t.type, color: c.name, iv: Math.floor(Math.random()*100)+1, baseValue: t.baseValue };
        gameData.characters.push(newChar);
        updateZukan(newChar);
    }
    
    gameData.lastGetTime = Date.now();
    localStorage.setItem('lastGetDate', today);
    save(); renderAll();
    alert(getCount === 2 ? "ログインボーナス！2体獲得！" : "キャラクターを獲得しました！");
}

function updateZukan(char) {
    if (!gameData.zukan[char.type]) gameData.zukan[char.type] = { colors: {}, maxIV: 0 };
    gameData.zukan[char.type].colors[char.color] = true;
    gameData.zukan[char.type].maxIV = Math.max(gameData.zukan[char.type].maxIV, char.iv);
}

function renderStorage() {
    const grid = document.getElementById('storage-grid');
    const sort = document.getElementById('sort-select').value;
    let list = [...gameData.characters];

    if (sort === 'type') list.sort((a,b) => b.baseValue - a.baseValue);
    else if (sort === 'income') list.sort((a,b) => getBaseIncome(b) - getBaseIncome(a));
    else list.reverse();

    const maxSpace = 3 + gameData.storageLevel;
    document.getElementById('storage-usage').innerText = `${gameData.characters.length}/${maxSpace}`;

    grid.innerHTML = list.map(c => {
        const isSet = c.id === gameData.activeCharId;
        return `<div class="card ${isSet?'active-set':''}">
            <span style="font-size:1.2rem; display:block; margin-bottom:5px;">${getColorEmoji(c.color)}</span>
            <b>${c.type}</b><br>(${c.color})<br>個体値: ${c.iv}<br>収益: ${getBaseIncome(c).toFixed(1)}<br>
            <button class="action-btn" onclick="setActive(${c.id})">${isSet?'解除':'セット'}</button>
            <button class="action-btn" onclick="useSpray(${c.id})">スプレー</button>
            <button class="action-btn" onclick="delChar(${c.id})" style="color:red; border-color:red;">捨てる</button>
        </div>`;
    }).join('');
}

function getColorEmoji(colorName) {
    const emojis = {"赤":"🔴","橙":"🟠","黄":"🟡","緑":"🟢","青":"🔵","藍":"🌌","紫":"🟣","銀":"🥈","金":"👑"};
    return emojis[colorName] || "⚪";
}

function useSpray(id) {
    if (gameData.sprayCount <= 0 || !confirm("スプレーを使用しますか？")) return;
    const char = gameData.characters.find(c => c.id === id);
    gameData.sprayCount--;
    char.color = lotteryColor().name;
    updateZukan(char); save(); renderAll();
}

function renderShop() {
    const list = document.getElementById('shop-list');
    const sPrice = 1000 * Math.pow(2, gameData.storageLevel);
    list.innerHTML = `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="text-align:left;"><b>倉庫拡張 (+1)</b><br>価格: ${sPrice}円</div>
            <button onclick="buy('s',${sPrice})">購入</button>
        </div>
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="text-align:left;"><b>カラースプレー</b><br>価格: 10,000円<br>所持: ${gameData.sprayCount}</div>
            <button onclick="buy('p',10000)">購入</button>
        </div>
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="text-align:left;"><b>真実の時計</b><br>価格: 100,000,000円<br>所持: ${gameData.clockCount}</div>
            <button onclick="buy('c',100000000)">購入</button>
        </div>
    `;
}

function buy(type, price) {
    if (gameData.money < price) return alert("お金が足りません");
    gameData.money -= price;
    if(type==='s') gameData.storageLevel++;
    if(type==='p') gameData.sprayCount++;
    if(type==='c') gameData.clockCount++;
    save(); renderAll();
}

function renderZukan() {
    document.getElementById('zukan-list').innerHTML = Object.entries(gameData.zukan).map(([type, d]) => {
        const cCount = Object.keys(d.colors).length;
        return `<div class="card"><b>${type}</b><br>最高個体値: ${d.maxIV}<br>色: ${cCount}/9 ${cCount===9?'★':''} ${d.maxIV===100?'💎':''}</div>`;
    }).join('');
}

function gameLoop() {
    let inc = 0, name = "なし";
    if (gameData.activeCharId) {
        const char = gameData.characters.find(c => c.id === gameData.activeCharId);
        if (char) { inc = getFullIncome(char); name = `${char.color}の${char.type}`; gameData.money += inc; }
    }
    document.getElementById('money').innerText = Math.floor(gameData.money);
    document.getElementById('income').innerText = inc.toFixed(1);
    document.getElementById('active-name').innerText = name;
    document.getElementById('log-days').innerText = gameData.logDays;

    const wait = 3600000 * Math.pow(0.99, gameData.clockCount);
    const rem = wait - (Date.now() - gameData.lastGetTime);
    const btn = document.getElementById('get-btn');
    if (rem > 0) {
        const m = Math.floor(rem/60000), s = Math.floor((rem%60000)/1000);
        document.getElementById('timer').innerText = `次まで ${m}分 ${s}秒`;
        btn.disabled = true;
    } else {
        document.getElementById('timer').innerText = "獲得可能！";
        btn.disabled = false;
    }
    gameData.lastUpdate = Date.now(); save();
}

function setActive(id) { gameData.activeCharId = (gameData.activeCharId===id)? null:id; renderAll(); }
function delChar(id) { if(confirm("捨てますか？")){ gameData.characters=gameData.characters.filter(c=>c.id!==id); if(gameData.activeCharId===id)gameData.activeCharId=null; renderAll(); } }
function switchTab(t) {
    ['storage','shop','zukan'].forEach(s => document.getElementById(s+'-sec').classList.add('hidden'));
    document.getElementById(t+'-sec').classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
}
function renderAll() { renderStorage(); renderShop(); renderZukan(); }
function save() { localStorage.setItem('TheHours_Final_NoImg', JSON.stringify(gameData)); }
init();
</script>
</body>
</html>
