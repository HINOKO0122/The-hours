<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>The hours</title>
    <style>
        :root { --main-color: #2c3e50; --accent-color: #2980b9; }
        body { font-family: sans-serif; background: #f8f9fa; padding: 20px; color: var(--main-color); }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .status-bar { display: flex; justify-content: space-around; background: #eee; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .main-btn { width: 100%; padding: 15px; font-size: 1.2rem; cursor: pointer; background: var(--accent-color); color: white; border: none; border-radius: 8px; }
        .main-btn:disabled { background: #ccc; }
        .tabs { margin: 20px 0; border-bottom: 2px solid #eee; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: none; }
        .tab-btn.active { border-bottom: 3px solid var(--accent-color); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; background: white; }
        .card.active-set { border: 3px solid #27ae60; }
        .hidden { display: none; }
        #timer { text-align: center; color: #e74c3c; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>The hours</h1>
    <div class="status-bar">
        <div>金貨: <span id="money">0</span></div>
        <div>収益: <span id="income">0</span>/s</div>
        <div>倉庫: <span id="storage-usage">0</span>/<span id="storage-max">1</span></div>
    </div>

    <button id="get-btn" class="main-btn" onclick="getCharacter()">GETする</button>
    <div id="timer"></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('storage')">倉庫</button>
        <button class="tab-btn" onclick="switchTab('shop')">ショップ</button>
        <button class="tab-btn" onclick="switchTab('zukan')">図鑑</button>
    </div>

    <div id="storage-sec">
        <div id="storage-grid" class="grid"></div>
    </div>

    <div id="shop-sec" class="hidden">
        <div id="shop-list" class="grid"></div>
    </div>

    <div id="zukan-sec" class="hidden">
        <div id="zukan-list"></div>
    </div>
</div>

<script>
let config = null;
let gameData = {
    money: 0,
    characters: [],
    activeCharId: null,
    lastGetTime: 0,
    lastUpdate: Date.now(),
    zukan: {},
    storageLevel: 0, // 倉庫拡張回数
    luckLevel: 0     // 幸運のお守り購入回数
};

async function init() {
    const res = await fetch('config.json');
    config = await res.json();
    const saved = localStorage.getItem('TheHours_v2');
    if (saved) gameData = JSON.parse(saved);
    
    renderAll();
    setInterval(gameLoop, 1000);
}

// 確率に基づいた色抽選
function lotteryColor() {
    const r = Math.random();
    let cumulative = 0;
    for (const c of config.colors) {
        cumulative += c.prob;
        if (r < cumulative) return c;
    }
    return config.colors[0];
}

// 収益計算 (色ボーナス + 全色コンプボーナス)
function calculateIncome(char) {
    const colorData = config.colors.find(c => c.name === char.color);
    let baseIncome = char.baseValue * (char.iv / 100) * colorData.bonus;
    
    // 図鑑コンプリートボーナス
    let compCount = 0;
    for (let type in gameData.zukan) {
        if (Object.keys(gameData.zukan[type].colors).length >= 9) compCount++;
    }
    const bonusMultiplier = 1 + (0.1 * compCount);
    
    return baseIncome * bonusMultiplier;
}

function getCharacter() {
    if (gameData.characters.length >= Math.pow(2, gameData.storageLevel)) {
        alert("倉庫がいっぱいです！");
        return;
    }
    const now = Date.now();
    if (now - gameData.lastGetTime < 3600000) return;

    const typeData = config.characters[Math.floor(Math.random() * config.characters.length)];
    const colorObj = lotteryColor();
    let iv = Math.floor(Math.random() * 100) + 1;
    iv = Math.min(100, iv + gameData.luckLevel); // お守り効果

    const newChar = {
        id: Date.now(),
        type: typeData.type,
        color: colorObj.name,
        iv: iv,
        baseValue: typeData.baseValue
    };

    gameData.characters.push(newChar);
    gameData.lastGetTime = now;
    updateZukan(newChar);
    save();
    renderAll();
}

function updateZukan(char) {
    if (!gameData.zukan[char.type]) gameData.zukan[char.type] = { colors: {}, maxIV: 0 };
    gameData.zukan[char.type].colors[char.color] = true;
    if (char.iv > gameData.zukan[char.type].maxIV) gameData.zukan[char.type].maxIV = char.iv;
}

function useColorSpray(charId) {
    const price = 500;
    if (gameData.money < price) return alert("お金が足りません");
    const char = gameData.characters.find(c => c.id === charId);
    if (!char) return;
    
    gameData.money -= price;
    const newColor = lotteryColor();
    char.color = newColor.name;
    updateZukan(char);
    save();
    renderAll();
    alert(`スプレーを使用！ ${newColor.name} になりました。`);
}

function renderShop() {
    const list = document.getElementById('shop-list');
    list.innerHTML = '';
    
    // 倉庫拡張価格: 2^n * 100
    const storagePrice = Math.pow(2, gameData.storageLevel) * 100;
    // お守り価格: 2^n
    const luckPrice = Math.pow(2, gameData.luckLevel);

    list.innerHTML += `
        <div class="card">
            <b>倉庫拡張</b><br>価格: ${storagePrice}円<br>
            <button onclick="buyItem('storage', ${storagePrice})">購入</button>
        </div>
        <div class="card">
            <b>幸運のお守り</b><br>効果: 初期IV+1<br>価格: ${luckPrice}円<br>
            <button onclick="buyItem('luck', ${luckPrice})">購入</button>
        </div>
    `;
}

function buyItem(type, price) {
    if (gameData.money < price) return alert("お金が足りません");
    gameData.money -= price;
    if (type === 'storage') gameData.storageLevel++;
    if (type === 'luck') gameData.luckLevel++;
    save();
    renderAll();
}

function renderStorage() {
    const grid = document.getElementById('storage-grid');
    grid.innerHTML = '';
    gameData.characters.forEach(char => {
        const isSet = char.id === gameData.activeCharId;
        const inc = calculateIncome(char);
        grid.innerHTML += `
            <div class="card ${isSet ? 'active-set' : ''}">
                <b>${char.type} (${char.color})</b><br>
                IV: ${char.iv} / 収益: ${inc.toFixed(1)}/s<br>
                <button onclick="setActive(${char.id})">${isSet ? '解除' : 'セット'}</button>
                <button onclick="deleteChar(${char.id})">捨てる</button><br>
                <button onclick="useColorSpray(${char.id})" style="margin-top:5px; font-size:0.8em;">カラースプレー(500円)</button>
            </div>
        `;
    });
}

function renderZukan() {
    const list = document.getElementById('zukan-list');
    list.innerHTML = '';
    for (let type in gameData.zukan) {
        const d = gameData.zukan[type];
        const count = Object.keys(d.colors).length;
        list.innerHTML += `<div class="card">${type} (最高IV: ${d.maxIV})<br>発見色: ${count}/9</div>`;
    }
}

function gameLoop() {
    const now = Date.now();
    let currentIncome = 0;
    if (gameData.activeCharId) {
        const char = gameData.characters.find(c => c.id === gameData.activeCharId);
        if (char) {
            currentIncome = calculateIncome(char);
            gameData.money += currentIncome;
        }
    }
    
    document.getElementById('money').innerText = Math.floor(gameData.money);
    document.getElementById('income').innerText = currentIncome.toFixed(1);
    document.getElementById('storage-usage').innerText = gameData.characters.length;
    document.getElementById('storage-max').innerText = Math.pow(2, gameData.storageLevel);
    
    const diff = now - gameData.lastGetTime;
    const btn = document.getElementById('get-btn');
    if (diff < 3600000) {
        const rem = 3600000 - diff;
        document.getElementById('timer').innerText = `あと ${Math.floor(rem/60000)}分${Math.floor((rem%60000)/1000)}秒`;
        btn.disabled = true;
    } else {
        document.getElementById('timer').innerText = "獲得可能！";
        btn.disabled = false;
    }
    gameData.lastUpdate = now;
    save();
}

function setActive(id) { gameData.activeCharId = (gameData.activeCharId === id) ? null : id; renderAll(); }
function deleteChar(id) { if(confirm("捨てますか？")){ gameData.characters = gameData.characters.filter(c => c.id !== id); if(gameData.activeCharId === id) gameData.activeCharId = null; renderAll(); } }
function switchTab(t) { 
    document.getElementById('storage-sec').classList.add('hidden');
    document.getElementById('shop-sec').classList.add('hidden');
    document.getElementById('zukan-sec').classList.add('hidden');
    document.getElementById(t + '-sec').classList.remove('hidden');
    renderAll();
}
function renderAll() { renderStorage(); renderShop(); renderZukan(); }
function save() { localStorage.setItem('TheHours_v2', JSON.stringify(gameData)); }

init();
</script>
</body>
</html>
