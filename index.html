<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The hours</title>
    <style>
        :root { --main-color: #2c3e50; --accent-color: #3498db; --bg-color: #f4f7f6; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-color); color: var(--main-color); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; letter-spacing: 2px; text-transform: uppercase; }
        
        .status-bar { display: flex; justify-content: space-around; background: #eee; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        
        .main-btn { display: block; width: 100%; padding: 20px; font-size: 1.2rem; cursor: pointer; background: var(--accent-color); color: white; border: none; border-radius: 10px; transition: 0.3s; }
        .main-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .main-btn:hover:not(:disabled) { background: #2980b9; }

        .tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 1rem; color: #7f8c8d; }
        .tab-btn.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; position: relative; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card.active-set { border: 3px solid #27ae60; background: #f0fff4; }
        
        .char-img { width: 80px; height: 80px; background: #eee; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #999; }
        
        .hidden { display: none; }
        .controls { margin-bottom: 15px; text-align: right; }
        .zukan-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>The hours</h1>

    <div class="status-bar">
        <div>Money: <span id="money">0</span> ¥</div>
        <div>Income: <span id="income">0</span> ¥/s</div>
        <div>Active: <span id="active-name">None</span></div>
    </div>

    <button id="get-btn" class="main-btn" onclick="getCharacter()">Get a Character</button>
    <p id="timer" style="text-align:center; color:#e74c3c; font-weight:bold;"></p>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('storage')">Storage</button>
        <button class="tab-btn" onclick="switchTab('shop')">Shop</button>
        <button class="tab-btn" onclick="switchTab('zukan')">Collection</button>
    </div>

    <div id="storage-sec">
        <div class="controls">
            Sort: <select id="sort-select" onchange="renderStorage()">
                <option value="new">Newest</option>
                <option value="iv">Highest IV</option>
                <option value="income">Highest Income</option>
            </select>
        </div>
        <div id="storage-grid" class="grid"></div>
    </div>

    <div id="shop-sec" class="hidden">
        <div id="shop-list" class="grid"></div>
    </div>

    <div id="zukan-sec" class="hidden">
        <div id="zukan-list"></div>
    </div>
</div>

<script>
let config = null;
let gameData = {
    money: 0,
    characters: [],
    activeCharId: null,
    lastGetTime: 0,
    lastUpdate: Date.now(),
    zukan: {},
    ownedItems: {}
};

async function init() {
    try {
        const response = await fetch('config.json');
        config = await response.json();
    } catch (e) {
        console.error("config.jsonが見つかりません。デフォルト値を使用します。");
        config = { characters: [{type:"Slime", baseValue:10}], colors: ["Normal"], items: [] };
    }
    
    const saved = localStorage.getItem('TheHours_Data');
    if (saved) {
        gameData = JSON.parse(saved);
        calculateOfflineEarnings();
    }
    
    renderShop();
    renderStorage();
    renderZukan();
    setInterval(gameLoop, 1000);
}

function calculateOfflineEarnings() {
    if (!gameData.activeCharId) return;
    const now = Date.now();
    const diffSec = Math.floor((now - gameData.lastUpdate) / 1000);
    const char = gameData.characters.find(c => c.id === gameData.activeCharId);
    if (char && diffSec > 0) {
        const amount = Math.floor((char.baseValue * char.iv / 100) * diffSec);
        gameData.money += amount;
        alert(`Offline earnings: ${amount} ¥ (${diffSec} seconds)`);
    }
}

function getCharacter() {
    const now = Date.now();
    if (now - gameData.lastGetTime < 3600000) return;

    const typeData = config.characters[Math.floor(Math.random() * config.characters.length)];
    const color = config.colors[Math.floor(Math.random() * config.colors.length)];
    let iv = Math.floor(Math.random() * 100) + 1;

    // アイテム効果（幸運のお守り）
    if (gameData.ownedItems['luck_charm']) {
        iv = Math.min(100, iv + 10);
    }

    const newChar = {
        id: Date.now(),
        type: typeData.type,
        color: color,
        iv: iv,
        baseValue: typeData.baseValue
    };

    gameData.characters.push(newChar);
    gameData.lastGetTime = now;
    updateZukan(newChar);
    save();
    renderStorage();
    alert(`Got: ${color} ${typeData.type} (IV: ${iv})`);
}

function updateZukan(char) {
    if (!gameData.zukan[char.type]) {
        gameData.zukan[char.type] = { colors: {}, maxIV: 0 };
    }
    const z = gameData.zukan[char.type];
    z.colors[char.color] = (z.colors[char.color] || 0) + 1;
    if (char.iv > z.maxIV) z.maxIV = char.iv;
}

function renderStorage() {
    const grid = document.getElementById('storage-grid');
    grid.innerHTML = '';
    
    let list = [...gameData.characters];
    const sort = document.getElementById('sort-select').value;
    if (sort === 'iv') list.sort((a,b) => b.iv - a.iv);
    else if (sort === 'income') list.sort((a,b) => (b.baseValue * b.iv) - (a.baseValue * a.iv));
    else list.reverse();

    list.forEach(char => {
        const isSet = char.id === gameData.activeCharId;
        const income = Math.floor(char.baseValue * char.iv / 100);
        const card = document.createElement('div');
        card.className = `card ${isSet ? 'active-set' : ''}`;
        card.innerHTML = `
            <div class="char-img">No Image</div>
            <strong>${char.type}</strong><br>
            <small>${char.color}</small><br>
            IV: ${char.iv}<br>
            ${income} ¥/s<br><br>
            <button onclick="setActive(${char.id})">${isSet ? 'Unset' : 'Set'}</button>
            <button onclick="deleteChar(${char.id})">Discard</button>
        `;
        grid.appendChild(card);
    });
}

function setActive(id) {
    gameData.activeCharId = (gameData.activeCharId === id) ? null : id;
    save();
    renderStorage();
}

function deleteChar(id) {
    if (!confirm("Discard this character?")) return;
    gameData.characters = gameData.characters.filter(c => c.id !== id);
    if (gameData.activeCharId === id) gameData.activeCharId = null;
    save();
    renderStorage();
}

function renderShop() {
    const list = document.getElementById('shop-list');
    list.innerHTML = '';
    config.items.forEach(item => {
        list.innerHTML += `
            <div class="card">
                <strong>${item.name}</strong><br>
                <small>${item.description}</small><br>
                Price: ${item.price} ¥<br>
                Owned: ${gameData.ownedItems[item.id] || 0}<br><br>
                <button onclick="buyItem('${item.id}')">Buy</button>
            </div>
        `;
    });
}

function buyItem(id) {
    const item = config.items.find(i => i.id === id);
    if (gameData.money >= item.price) {
        gameData.money -= item.price;
        gameData.ownedItems[id] = (gameData.ownedItems[id] || 0) + 1;
        save();
        renderShop();
        alert("Purchased!");
    } else {
        alert("Not enough money!");
    }
}

function renderZukan() {
    const list = document.getElementById('zukan-list');
    list.innerHTML = '';
    for (let type in gameData.zukan) {
        const d = gameData.zukan[type];
        const colors = Object.keys(d.colors).join(', ');
        list.innerHTML += `
            <div class="zukan-item">
                <strong>${type}</strong> (Max IV: ${d.maxIV})<br>
                <small>Discovered colors: ${colors}</small>
            </div>
        `;
    }
}

function switchTab(tab) {
    document.getElementById('storage-sec').classList.add('hidden');
    document.getElementById('shop-sec').classList.add('hidden');
    document.getElementById('zukan-sec').classList.add('hidden');
    document.getElementById(tab + '-sec').classList.remove('hidden');
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (tab === 'zukan') renderZukan();
}

function gameLoop() {
    const now = Date.now();
    if (gameData.activeCharId) {
        const char = gameData.characters.find(c => c.id === gameData.activeCharId);
        if (char) {
            const inc = char.baseValue * char.iv / 100;
            gameData.money += inc;
            document.getElementById('income').innerText = Math.floor(inc);
            document.getElementById('active-name').innerText = char.type;
        }
    } else {
        document.getElementById('income').innerText = 0;
        document.getElementById('active-name').innerText = "None";
    }

    const diff = now - gameData.lastGetTime;
    const btn = document.getElementById('get-btn');
    if (diff < 3600000) {
        const rem = 3600000 - diff;
        const m = Math.floor(rem / 60000);
        const s = Math.floor((rem % 60000) / 1000);
        document.getElementById('timer').innerText = `Next: ${m}m ${s}s`;
        btn.disabled = true;
    } else {
        document.getElementById('timer').innerText = "Ready!";
        btn.disabled = false;
    }

    document.getElementById('money').innerText = Math.floor(gameData.money);
    gameData.lastUpdate = now;
    save();
}

function save() {
    localStorage.setItem('TheHours_Data', JSON.stringify(gameData));
}

init();
</script>
</body>
</html>
