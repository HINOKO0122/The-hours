<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json?v=9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The hours</title>
    <style>
        :root { --main: #2c3e50; --accent: #2980b9; --bg: #f4f7f6; --lock: #95a5a6; --danger: #e74c3c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--main); }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status { display: grid; grid-template-columns: 1fr 1fr; background: #eee; padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 0.85rem; gap: 5px; }
        .status-full { grid-column: 1/3; border-top: 1px solid #ccc; padding-top: 5px; text-align: center; }
        .main-btn { width: 100%; padding: 18px; background: var(--accent); color: #fff; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .main-btn:disabled { background: #ccc; }
        .tabs { display: flex; gap: 5px; margin: 10px 0; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 8px; font-size: 0.8rem; }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; text-align: center; font-size: 0.85rem; background: #fff; position: relative; }
        .card.active-set { border: 2px solid #27ae60; background: #f0fff4; }
        .hidden { display: none; }
        #timer { text-align: center; font-weight: bold; font-size: 0.9rem; color: #e74c3c; margin-bottom: 10px; }
        .action-btn { width: 100%; margin-top: 5px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; background: #fff; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .lock-btn { position: absolute; top: 5px; right: 5px; background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .backup-area { margin-top: 15px; border-top: 2px dashed #ccc; padding-top: 15px; }
        textarea { width: 100%; height: 80px; font-size: 0.7rem; margin: 5px 0; background: #f9f9f9; border: 1px solid #ddd; padding: 5px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h1>The hours</h1>
    <div class="status">
        <div>金貨: <span id="money">0</span></div>
        <div>収益: <span id="income">0</span>/s</div>
        <div class="status-full">セット中: <span id="active-name">なし</span></div>
        <div class="status-full">累計ログイン: <span id="log-days">0</span>日</div>
    </div>

    <div id="timer">確認中...</div>
    <button id="get-btn" class="main-btn" onclick="getCharacter()">GETする</button>

    <div class="tabs">
        <button id="tab-storage" class="tab-btn active" onclick="switchTab('storage')">倉庫</button>
        <button id="tab-shop" class="tab-btn" onclick="switchTab('shop')">ショップ</button>
        <button id="tab-zukan" class="tab-btn" onclick="switchTab('zukan')">図鑑</button>
    </div>

    <div id="storage-sec">
        <div style="font-weight: bold; margin-bottom: 5px;">倉庫: <span id="storage-usage">0/0</span></div>
        <div id="storage-grid" class="grid"></div>
    </div>

    <div id="shop-sec" class="hidden">
        <div id="shop-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div class="backup-area">
            <p style="font-size:0.8rem; font-weight:bold;">💾 バックアップ</p>
            <button class="action-btn" onclick="generateBackupCode()">コードを生成</button>
            <textarea id="backup-text" readonly></textarea>
            <button class="action-btn" onclick="copyBackup()">コードをコピー</button>
            <hr>
            <textarea id="restore-text" placeholder="復旧コードを貼り付け"></textarea>
            <button class="action-btn" onclick="restoreData()">データを復旧</button>
        </div>
    </div>

    <div id="zukan-sec" class="hidden">
        <div id="zukan-list" class="grid"></div>
    </div>
</div>

<script>
const SAVE_KEY = 'TheHours_v8';
let config = null;
let gameData = {
    money: 0, characters: [], activeCharId: null, lastGetTime: 0, lastUpdate: Date.now(),
    zukan: {}, storageLevel: 0, sprayCount: 0, clockCount: 0, logDays: 0, lastLogDate: "", lastGetDate: "",
    nextFate: null
};

async function init() {
    try {
        const res = await fetch('config.json');
        config = await res.json();
        
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            gameData = {...gameData, ...parsed};
        }
        
        // Config読み込み後に「次の運命」を生成
        if (!gameData.nextFate) generateNextFate();
        
        calcOffline();
        checkLogin();
        autoSetBestCharacter();
        renderAll();
        setInterval(gameLoop, 1000);
    } catch(e) {
        console.error(e);
        document.getElementById('timer').innerText = "通信エラー";
    }
}

function generateNextFate() {
    if (!config) return;
    const t = config.characters[Math.floor(Math.random() * config.characters.length)];
    const c = config.colors[Math.floor(Math.random() * config.colors.length)];
    gameData.nextFate = {
        type: t.type,
        color: c.name,
        iv: Math.floor(Math.random() * 100) + 1,
        baseValue: t.baseValue
    };
    save();
}

function getCharacter() {
    const today = new Date().toLocaleDateString();
    const isFirstToday = gameData.lastGetDate !== today;
    const getCount = isFirstToday ? 2 : 1;
    const maxSpace = 3 + (gameData.storageLevel || 0);

    if (gameData.characters.length + getCount > maxSpace) return alert("倉庫がいっぱいです");

    const wait = 3600000 * Math.pow(0.99, gameData.clockCount || 0);
    if (Date.now() - (gameData.lastGetTime || 0) < wait) return;

    for(let i=0; i<getCount; i++) {
        const newChar = { 
            id: Date.now() + i, 
            ...gameData.nextFate, 
            locked: false 
        };
        gameData.characters.push(newChar);
        updateZukan(newChar);
        generateNextFate(); // 次をセット
    }
    
    gameData.lastGetTime = Date.now();
    gameData.lastGetDate = today;
    autoSetBestCharacter();
    save(); renderAll();
    alert(getCount === 2 ? "2体GETしました！" : "1体GETしました！");
}

function renderStorage() {
    const grid = document.getElementById('storage-grid');
    document.getElementById('storage-usage').innerText = `${gameData.characters.length}/${3 + (gameData.storageLevel || 0)}`;
    
    let list = [...gameData.characters].reverse();
    grid.innerHTML = list.map(c => {
        const isSet = c.id === gameData.activeCharId;
        return `<div class="card ${isSet?'active-set':''}">
            <button class="lock-btn" onclick="toggleLock(${c.id})">${c.locked ? "🔒" : "🔓"}</button>
            <span style="font-size:1.5rem;">${getColorEmoji(c.color)}</span><br>
            <b>${c.type}</b><br>IV: ${c.iv}<br>収益: ${getBaseIncome(c).toFixed(1)}<br>
            <button class="action-btn" onclick="setActive(${c.id})">${isSet?'解除':'セット'}</button>
            <button class="action-btn" onclick="useSpray(${c.id})" ${gameData.sprayCount > 0 ? '' : 'style="color:#ccc;"'}>スプレー (${gameData.sprayCount||0})</button>
            ${!c.locked ? `<button class="action-btn" onclick="delChar(${c.id})" style="color:var(--danger); border-color:var(--danger);">捨てる</button>` : ''}
        </div>`;
    }).join('');
}

function useSpray(id) {
    if ((gameData.sprayCount || 0) <= 0) return alert("スプレー不足");
    if (!confirm("色を変えますか？")) return;
    const char = gameData.characters.find(c => c.id === id);
    if (char) {
        gameData.sprayCount--;
        const c = config.colors[Math.floor(Math.random() * config.colors.length)];
        char.color = c.name;
        updateZukan(char);
        save(); renderAll();
    }
}

function renderZukan() {
    const zList = document.getElementById('zukan-list');
    const discovered = Object.keys(gameData.zukan || {});
    zList.innerHTML = discovered.map(type => {
        const d = gameData.zukan[type];
        const colorCount = Object.keys(d.colors || {}).length;
        const maxIV = d.maxIV || 0;
        return `<div class="card">
            <b>${type}</b><br>色: ${colorCount}/9<br>最大IV: ${maxIV}
            ${colorCount>=9 ? "<br><span style='color:orange;'>色コンプ★</span>":""}
            ${maxIV>=100 ? "<br><span style='color:gold;'>MAX個体値発見★</span>":""}
        </div>`;
    }).join('');
}

function getBaseIncome(char) {
    if(!config) return 0;
    const cData = config.colors.find(c => c.name === char.color);
    return char.baseValue * (char.iv / 100) * (cData ? cData.bonus : 1);
}

function getFullIncome(char) {
    const base = getBaseIncome(char);
    const colorComp = Object.values(gameData.zukan).filter(z => Object.keys(z.colors || {}).length >= 9).length;
    const ivComp = Object.values(gameData.zukan).filter(z => (z.maxIV || 0) >= 100).length;
    return base * (1 + colorComp * 0.1) * (1 + ivComp * 0.1) + (gameData.logDays || 0);
}

function getColorEmoji(colorName) {
    const emojis = {"赤":"🩷","橙":"🧡","黄":"💛","緑":"💚","青":"🩵","藍":"💙","紫":"💜","銀":"🥈","金":"👑"};
    return emojis[colorName] || "⚪";
}

function renderShop() {
    const list = document.getElementById('shop-list');
    const sPrice = 1000 * Math.pow(2, gameData.storageLevel || 0);
    list.innerHTML = `
        <div class="card">倉庫拡張 (+1): ${sPrice.toLocaleString()}円 <button onclick="buy('s',${sPrice})">購入</button></div>
        <div class="card">カラースプレー: 10,000円 <button onclick="buy('p',10000)">購入</button></div>
        <div class="card">真実の時計: 1億円 <button onclick="buy('c',100000000)">購入</button></div>
    `;
}

function buy(type, price) {
    if (gameData.money < price) return alert("不足");
    gameData.money -= price;
    if(type==='s') gameData.storageLevel++;
    if(type==='p') gameData.sprayCount++;
    if(type==='c') gameData.clockCount++;
    save(); renderAll();
}

function autoSetBestCharacter() {
    if (!gameData.activeCharId && gameData.characters.length > 0) {
        let best = gameData.characters[0];
        gameData.characters.forEach(c => { if(getBaseIncome(c) > getBaseIncome(best)) best = c; });
        gameData.activeCharId = best.id;
    }
}

function updateZukan(char) {
    if (!gameData.zukan[char.type]) gameData.zukan[char.type] = { colors: {}, maxIV: 0 };
    gameData.zukan[char.type].colors[char.color] = true;
    gameData.zukan[char.type].maxIV = Math.max(gameData.zukan[char.type].maxIV || 0, char.iv);
}

function gameLoop() {
    let inc = 0, name = "なし";
    if (gameData.activeCharId) {
        const char = gameData.characters.find(c => c.id === gameData.activeCharId);
        if (char) { inc = getFullIncome(char); name = `${char.color}の${char.type}`; gameData.money += inc; }
    }
    document.getElementById('money').innerText = Math.floor(gameData.money).toLocaleString();
    document.getElementById('income').innerText = inc.toFixed(1);
    document.getElementById('active-name').innerText = name;
    document.getElementById('log-days').innerText = gameData.logDays || 0;
    
    const wait = 3600000 * Math.pow(0.99, gameData.clockCount || 0);
    const rem = wait - (Date.now() - (gameData.lastGetTime || 0));
    const btn = document.getElementById('get-btn');
    if (rem > 0) {
        const m = Math.floor(rem/60000), s = Math.floor((rem%60000)/1000);
        document.getElementById('timer').innerText = `次まで ${m}分 ${s}秒`;
        btn.disabled = true;
    } else { document.getElementById('timer').innerText = "獲得可能！"; btn.disabled = false; }
    gameData.lastUpdate = Date.now(); save();
}

function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(gameData)); }
function toggleLock(id) { const char = gameData.characters.find(c => c.id === id); if (char) { char.locked = !char.locked; save(); renderStorage(); } }
function setActive(id) { gameData.activeCharId = (gameData.activeCharId===id)? null:id; if(!gameData.activeCharId) autoSetBestCharacter(); renderAll(); }
function delChar(id) { if(confirm("捨てる？")){ gameData.characters=gameData.characters.filter(c=>c.id!==id); if(gameData.activeCharId===id) gameData.activeCharId = null; autoSetBestCharacter(); renderAll(); } }
function switchTab(t) {
    ['storage','shop','zukan'].forEach(s => document.getElementById(s+'-sec').classList.add('hidden'));
    document.getElementById(t+'-sec').classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
    renderAll();
}
function calcOffline() {
    if (!gameData.activeCharId) return;
    const diff = Math.floor((Date.now() - (gameData.lastUpdate || Date.now())) / 1000);
    if (diff > 0) {
        const char = gameData.characters.find(c => c.id === gameData.activeCharId);
        if (char) gameData.money += getFullIncome(char) * diff;
    }
}
function checkLogin() { const t = new Date().toLocaleDateString(); if (gameData.lastLogDate !== t) { gameData.logDays++; gameData.lastLogDate = t; save(); } }
function generateBackupCode() { document.getElementById('backup-text').value = btoa(unescape(encodeURIComponent(JSON.stringify(gameData)))); }
function copyBackup() { const a = document.getElementById('backup-text'); a.select(); document.execCommand('copy'); alert("コピー済"); }
function restoreData() { const c = document.getElementById('restore-text').value; try { gameData = JSON.parse(decodeURIComponent(escape(atob(c)))); save(); location.reload(); } catch(e) { alert("無効"); } }
function renderAll() { renderStorage(); renderShop(); renderZukan(); }
init();
</script>
</body>
</html>
